dev:
  catalog: dbr_dev_ua5816bd
  schemas:
    bronze: aircheck_bronze
    silver: aircheck_silver
    gold:   aircheck_gold
    ops:    aircheck_ops
  volume: raw
  key_vault_name: kvua5816bd
  secret_scope: default
  secrets:
    contact_email: aircheck-contact-email
    eventhub_conn_str: aircheck-eventhub-conn-str
  eventhub_namespace: evhua5816bd
  eventhub_name: aircheck-sensor-readings
  streaming:
    poll_interval_sec: 90
    max_retries: 3
    retry_backoff_base: 2
    request_timeout_sec: 30
    sensor_type_filter: "SDS011"
    country_filter: "UA,PL,DE"
    checkpoint_path: "/Volumes/dbr_dev_ua5816bd/aircheck_bronze/raw/_checkpoints/sensor_live"
    target_table: "sensor_live_raw"
    max_offsets_per_trigger: 5000
    base_measurement_fields: ["P1", "P2"]
    phase_b_extra_fields: ["temperature", "humidity", "pressure"]
  batch:
    base_url: "https://archive.sensor.community/"
    file_limit: null
    target_table: "sensor_archive_raw"
    registry_table: "device_registry_raw"
    landing_path: "archive"
    checkpoint_path: "_checkpoints/archive_bronze"
    schema_path: "_schemas/archive_bronze"
    csv_delimiter: ";"
    natural_keys:
      - "sensor_id"
      - "timestamp"
    metadata_source: "sensor_archive"
    sensor_type_filter: "SDS011"
    max_workers: 16
    request_timeout: 30